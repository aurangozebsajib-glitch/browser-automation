<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen Prompt Studio - Tool by Meta AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
.card{transition:all .2s}
.card:hover{transform:translateY(-2px)}
</style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen">
<div class="max-w-6xl mx-auto p-4 md:p-8">
  <!-- Header -->
  <div class="flex justify-between items-center mb-8 border-b border-zinc-800 pb-6">
    <div>
      <h1 class="text-3xl font-bold">Qwen Prompt Studio</h1>
      <p class="text-zinc-400 mt-1">Tool by Meta AI • Automation by DeepSeek • API: <span id="apiStatus" class="text-yellow-400">checking...</span></p>
    </div>
    <div class="flex gap-2">
      <input id="apiKeyInput" placeholder="X-API-KEY (optional)" class="bg-zinc-900 border border-zinc-700 px-3 py-2 rounded text-sm w-40">
      <button onclick="checkStatus()" class="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded text-sm">Refresh</button>
    </div>
  </div>
  <div class="grid md:grid-cols-2 gap-6">
    <!-- Input -->
    <div class="bg-zinc-900 rounded-xl p-5 border border-zinc-800">
      <h2 class="font-semibold mb-3">1. Paste Qwen Response</h2>
      <textarea id="rawInput" class="w-full h-[400px] bg-black border border-zinc-700 rounded-lg p-4 mono text-sm" placeholder="Paste Qwen response here...
Example:
Here are 10 prompts:
1. A cyberpunk girl on rooftop, neon lights, anime style
2. Close up of glowing sword, detailed...
3. ..."></textarea>
      <div class="flex gap-2 mt-4">
        <button onclick="parseText()" class="flex-1 bg-white text-black font-semibold py-3 rounded-lg hover:bg-zinc-200">🔍 Parse Prompts</button>
        <button onclick="saveToKV()" class="bg-zinc-800 py-3 px-6 rounded-lg hover:bg-zinc-700">💾 Save to KV</button>
      </div>
      <div class="mt-4 text-xs text-zinc-500">
        Supports: <code>1. 2. 3.</code> • <code>- bullet</code> • <code>```code```</code> • Each line
      </div>
    </div>
    <!-- Output -->
    <div class="bg-zinc-900 rounded-xl p-5 border border-zinc-800">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-semibold">2. Parsed Prompts (<span id="count">0</span>)</h2>
        <div class="flex gap-2">
          <button onclick="copyAll()" class="text-xs bg-zinc-800 px-3 py-1.5 rounded hover:bg-zinc-700">Copy All</button>
          <button onclick="downloadJSON()" class="text-xs bg-zinc-800 px-3 py-1.5 rounded hover:bg-zinc-700">Download JSON</button>
        </div>
      </div>
      <div id="output" class="space-y-3 max-h-[450px] overflow-y-auto pr-2">
        <div class="text-zinc-500 text-sm text-center py-20">No prompts yet. Paste and click Parse.</div>
      </div>
    </div>
  </div>
  <!-- Latest from KV -->
  <div class="mt-6 bg-zinc-900 rounded-xl p-5 border border-zinc-800">
    <h2 class="font-semibold mb-3">3. Latest from Automation (KV)</h2>
    <button onclick="loadLatest()" class="text-sm bg-zinc-800 px-4 py-2 rounded mb-3 hover:bg-zinc-700">🔄 Load /api/results/latest</button>
    <pre id="latestBox" class="bg-black rounded-lg p-4 mono text-xs overflow-x-auto text-zinc-300">Click load...</pre>
  </div>
</div>
<script>
const API_BASE = ""; // same origin
async function checkStatus(){
  try{
    const r = await fetch(`${API_BASE}/api/status`);
    const j = await r.json();
    document.getElementById('apiStatus').innerHTML = `<span class="text-green-400">● Online (KV:${j.kv} Auth:${j.hasAuth})</span>`;
  }catch(e){
    document.getElementById('apiStatus').innerHTML = `<span class="text-red-400">● Offline</span>`;
  }
}
checkStatus();
function getHeaders(){
  const h = {"Content-Type":"application/json"};
  const key = document.getElementById('apiKeyInput').value.trim();
  if(key) h["X-API-KEY"] = key;
  return h;
}
let lastParsed = [];
async function parseText(){
  const raw = document.getElementById('rawInput').value;
  if(!raw.trim()){ alert("Paste Qwen response first"); return; }
  
  const btn = event.target;
  btn.textContent = "Parsing...";
  try{
    const res = await fetch(`${API_BASE}/api/parse`, {
      method:"POST",
      headers: getHeaders(),
      body: JSON.stringify({text: raw})
    });
    const data = await res.json();
    lastParsed = data.prompts || [];
    renderPrompts(lastParsed);
    document.getElementById('count').textContent = data.count;
  }catch(e){
    alert("Parse failed: "+e.message);
  }
  btn.textContent = "🔍 Parse Prompts";
}
function renderPrompts(prompts){
  const out = document.getElementById('output');
  if(!prompts.length){
    out.innerHTML = `<div class="text-zinc-500 text-center py-10">No prompts detected. Try different format.</div>`;
    return;
  }
  out.innerHTML = prompts.map((p,i)=>`
    <div class="card bg-black border border-zinc-800 rounded-lg p-4">
      <div class="flex justify-between items-start gap-3">
        <div class="flex-1">
          <div class="text-[11px] text-zinc-500 mb-1">#${i+1}</div>
          <div class="text-sm leading-relaxed">${escapeHtml(p)}</div>
        </div>
        <button onclick="copyOne(${i})" class="text-xs bg-zinc-800 hover:bg-zinc-700 px-2.5 py-1.5 rounded">Copy</button>
      </div>
    </div>
  `).join('');
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function copyOne(i){
  navigator.clipboard.writeText(lastParsed[i]);
  alert("Copied prompt "+(i+1));
}
function copyAll(){
  if(!lastParsed.length) return;
  navigator.clipboard.writeText(lastParsed.join("\n"));
  alert("Copied all "+lastParsed.length+" prompts");
}
function downloadJSON(){
  if(!lastParsed.length) return;
  const blob = new Blob([JSON.stringify({prompts:lastParsed,count:lastParsed.length,generatedAt:new Date().toISOString()},null,2)],{type:"application/json"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `prompts_${Date.now()}.json`;
  a.click();
}
async function saveToKV(){
  if(!lastParsed.length){ alert("Parse first"); return; }
  try{
    const res = await fetch(`${API_BASE}/api/results`,{
      method:"POST",
      headers:getHeaders(),
      body: JSON.stringify({raw_response: document.getElementById('rawInput').value})
    });
    const j = await res.json();
    if(j.ok) alert(`Saved to KV! Count: ${j.count}`);
    else alert(JSON.stringify(j));
  }catch(e){ alert(e.message); }
}
async function loadLatest(){
  try{
    const res = await fetch(`${API_BASE}/api/results/latest`,{headers:getHeaders()});
    const j = await res.json();
    document.getElementById('latestBox').textContent = JSON.stringify(j,null,2);
    if(j && j.parsed){
      lastParsed = j.parsed;
      renderPrompts(lastParsed);
      document.getElementById('count').textContent = lastParsed.length;
    }
  }catch(e){
    document.getElementById('latestBox').textContent = "Error: "+e.message;
  }
}
</script>
</body>
</html>
